[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nooshare-backtest"
version = "0.1.0"
description = "Reproducible A-share daily backtest engine with order, fill and ledger semantics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
backtest = "nooshare_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nooshare_backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
