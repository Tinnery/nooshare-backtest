name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out PR merge commit or pushed commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest tests/ -v

  workspace_source_export:
    name: Workspace Source Export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Package tracked source, tests and fixtures
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          if commit != expected:
              raise SystemExit(
                  f"source export SHA mismatch: expected {expected}, got {commit}"
              )

          repository = os.environ["GITHUB_REPOSITORY"]
          max_file_bytes = 50 * 1024 * 1024
          excluded_segments = {
              ".git", ".venv", "venv", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", ".runtime", ".generated",
              ".cache", "node_modules",
          }
          records = []
          excluded = []

          entries = subprocess.check_output(
              [
                  "git", "ls-files", "--stage",
                  "--format=%(objectmode)%x09%(objectname)%x09%(stage)%x09%(path)",
                  "-z",
              ]
          ).split(b"\0")

          for entry in entries:
              if not entry:
                  continue
              mode, _blob, _stage, raw_path = entry.split(b"\t", 3)
              path = raw_path.decode("utf-8", errors="strict")
              rel = PurePosixPath(path)
              parts = tuple(part.lower() for part in rel.parts)
              source = root.joinpath(*rel.parts)
              reason = None

              if mode == "160000":
                  reason = "git-submodule-pointer"
              elif any(part in excluded_segments for part in parts):
                  reason = "generated-or-dependency-directory"
              elif not source.is_file():
                  reason = "not-a-regular-file"
              elif source.stat().st_size > max_file_bytes:
                  reason = "file-over-50-mib"

              if reason:
                  excluded.append({"path": path, "reason": reason})
                  continue

              data = source.read_bytes()
              records.append({
                  "path": path,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "mode": "0755" if mode.endswith("755") else "0644",
              })

          records.sort(key=lambda item: item["path"])
          excluded.sort(key=lambda item: item["path"])
          manifest = {
              "schema_version": 1,
              "repository": repository,
              "commit": commit,
              "file_count": len(records),
              "fixture_file_count": sum(
                  1 for item in records
                  if any(
                      marker in part.lower()
                      for part in PurePosixPath(item["path"]).parts
                      for marker in ("test", "fixture", "sample")
                  )
              ),
              "files": records,
              "excluded_file_count": len(excluded),
              "excluded": excluded,
              "exclusion_policy": {
                  "max_file_bytes": max_file_bytes,
                  "purpose": "exclude generated dependencies and large assets while retaining tracked source, tests and fixtures",
              },
          }
          manifest_bytes = json.dumps(
              manifest, ensure_ascii=False, sort_keys=True, indent=2
          ).encode("utf-8")

          output_dir = Path(os.environ["RUNNER_TEMP"])
          archive_path = output_dir / "workspace-source.tar.gz"
          manifest_path = output_dir / "workspace-source-manifest.json"

          with tarfile.open(archive_path, "w:gz", compresslevel=6) as archive:
              for item in records:
                  data = root.joinpath(*PurePosixPath(item["path"]).parts).read_bytes()
                  info = tarfile.TarInfo(item["path"])
                  info.size = len(data)
                  info.mode = int(item["mode"], 8)
                  info.mtime = 0
                  archive.addfile(info, io.BytesIO(data))

              info = tarfile.TarInfo("WORKSPACE-MANIFEST.json")
              info.size = len(manifest_bytes)
              info.mode = 0o644
              info.mtime = 0
              archive.addfile(info, io.BytesIO(manifest_bytes))

          manifest_path.write_bytes(manifest_bytes)
          print(json.dumps({
              "status": "EXPORTED",
              "repository": repository,
              "commit": commit,
              "files": len(records),
              "fixture_files": manifest["fixture_file_count"],
              "excluded": len(excluded),
              "archive_bytes": archive_path.stat().st_size,
              "archive_sha256": hashlib.sha256(archive_path.read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-source.tar.gz
            ${{ runner.temp }}/workspace-source-manifest.json
          if-no-files-found: error
          retention-days: 3
